name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. 下载仓库文件
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 解压你上传的 Android 工程 ZIP
      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "错误：没有找到 ZIP 文件"
            exit 1
          fi

          echo "找到 ZIP：$ZIP"

          mkdir -p /tmp/android-project

          unzip -q -o "$ZIP" -d /tmp/android-project

          cp -a /tmp/android-project/. .

          echo "检查 Android 工程文件："

          find . -maxdepth 3 -type f | sort | head -200

          if [ ! -f "settings.gradle" ]; then
            echo "错误：没有找到 settings.gradle"
            exit 1
          fi

          if [ ! -f "app/build.gradle" ]; then
            echo "错误：没有找到 app/build.gradle"
            exit 1
          fi

          echo "Android 工程检查通过"

      # 3. 安装 Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. 安装 Gradle 8.13
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 5. 准备 Android SDK
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "PATH=$PATH"

          echo "接受 Android SDK licenses..."

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "安装 Android SDK..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK 准备完成"

      # 6. 编译 APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "开始编译 APK..."

          gradle --no-daemon assembleDebug

          echo "APK 编译完成"

          ls -lh app/build/outputs/apk/debug/

      # 7. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhaoyaojing-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
